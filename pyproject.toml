[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "legal-graphrag"
version = "0.1.0"
description = "A sample Vietnamese legal GraphRAG service using FalkorDB and Qdrant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenAI Codex" }]
# Dependencies are managed in requirements.txt for Miniconda environments.
dependencies = []

[project.scripts]
legal-graphrag = "legal_graphrag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/legal_graphrag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
